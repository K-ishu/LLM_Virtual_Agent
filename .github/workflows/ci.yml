name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  test-and-build:
    name: Test, evaluate, and build image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare deterministic benchmark
        run: python data_sources/prepare_benchmark.py

      - name: Run unit tests
        env:
          LLM_PROVIDER: mock
        run: pytest -q

      - name: Run mock evaluation
        env:
          LLM_PROVIDER: mock
        run: |
          python evaluation/evaluate_with_rubric.py \
            --input data/processed/eval_set.json \
            --output data/processed/evaluation_results_ci.json

      - name: Build Docker image
        run: docker build -t llm-se-assistant:ci .
