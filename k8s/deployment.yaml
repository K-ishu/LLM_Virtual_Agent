apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-se-assistant
  namespace: llm-se-assistant
  labels:
    app: llm-se-assistant
spec:
  replicas: 2
  selector:
    matchLabels:
      app: llm-se-assistant
  template:
    metadata:
      labels:
        app: llm-se-assistant
    spec:
      containers:
        - name: llm-se-assistant
          image: llm-se-assistant:local
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8501
              protocol: TCP

          envFrom:
            - configMapRef:
                name: llm-se-assistant-config
            - secretRef:
                name: llm-se-assistant-secrets
                optional: true

          env:
            - name: STREAMLIT_SERVER_PORT
              value: "8501"
            - name: STREAMLIT_SERVER_ADDRESS
              value: "0.0.0.0"

          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "700m"
              memory: "1Gi"

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL

      restartPolicy: Always
