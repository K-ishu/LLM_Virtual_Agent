apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-se-assistant
  namespace: llm-se-assistant
  labels:
    app: llm-se-assistant
spec:
  replicas: 2
  selector:
    matchLabels:
      app: llm-se-assistant
  template:
    metadata:
      labels:
        app: llm-se-assistant
    spec:
      containers:
        - name: llm-se-assistant
          image: ghcr.io/k-ishu/llm_virtual_agent:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8501
              name: http

          envFrom:
            - configMapRef:
                name: llm-se-assistant-config
            - secretRef:
                name: llm-se-assistant-secrets
                optional: true

          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
