services:
  - type: web
    name: llm-se-assistant
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /_stcore/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: LLM_PROVIDER
        value: mock
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_BASE_URL
        value: ""
      - key: OPENAI_API_KEY
        sync: false
